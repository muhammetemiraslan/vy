<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Depo Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEE9;
  --surface:#FFFFFF;
  --ink:#151A17;
  --ink2:#5C665F;
  --line:#D8DCD5;
  --signal:#F2C230;
  --go:#1C7A4E;
  --alert:#B3382B;
  --radius:10px;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.4;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

.app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);
     padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#F4F6F2;
     padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:.2px;margin:0;line-height:1}
.top .sub{font-size:13px;color:#9FAAA2;margin-top:4px}
.top-actions{display:flex;gap:8px}
.chip-btn{background:rgba(255,255,255,.12);color:#F4F6F2;border-radius:999px;
          padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip-btn:active{background:rgba(255,255,255,.24)}
.chip-btn.solid{background:var(--signal);color:var(--ink)}

.search{margin-top:12px;position:relative}
.search input{width:100%;background:#232B26;border:1px solid #333C36;color:#F4F6F2;
  border-radius:var(--radius);padding:12px 40px 12px 14px;font-size:16px}
.search input::placeholder{color:#7E8A82}
.search input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:transparent}
.search .clr{position:absolute;right:6px;top:6px;bottom:6px;width:32px;color:#9FAAA2;font-size:18px;display:none}
.search.has .clr{display:block}

.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);
     border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink2)}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- product rows ---------- */
.rows{padding:12px 12px 24px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
     padding:12px 12px 12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.row.queued{border-color:var(--signal);box-shadow:inset 4px 0 0 var(--signal)}
.row.empty-stock{opacity:.62}
.r-main{flex:1;min-width:0}
.r-name{font-weight:600;font-size:17px;line-height:1.25;word-break:break-word}
.r-meta{font-size:13.5px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.r-meta b{font-family:var(--cond);font-weight:700;font-size:16px;color:var(--ink)}
.tag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px}
.tag.low{background:#F7E6E3;color:var(--alert)}
.tag.zero{background:#EBEDE9;color:var(--ink2)}
.tag.loc{background:#EDEFEA;color:var(--ink2);font-family:var(--cond);font-size:14px;letter-spacing:.3px}
.r-edit{color:#A9B1AA;padding:4px;font-size:15px;align-self:flex-start;margin:-4px -4px 0 0}

.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:42px;height:42px;border-radius:9px;background:#EDEFEA;font-size:22px;
  font-weight:600;line-height:1;display:grid;place-items:center;color:var(--ink)}
.stepper button:active{background:var(--line)}
.stepper .qty{font-family:var(--cond);font-weight:700;font-size:24px;min-width:34px;text-align:center}
.add-btn{width:46px;height:46px;border-radius:11px;background:var(--ink);color:#fff;
  font-size:26px;line-height:1;display:grid;place-items:center;flex:none}
.add-btn:active{background:#2E3833}
.add-btn[disabled]{background:#DDE1DA;color:#A3ABA4}

/* ---------- picking list ---------- */
.stripe{height:6px;background:repeating-linear-gradient(45deg,var(--signal) 0 10px,var(--ink) 10px 20px)}
.group{padding:18px 14px 6px;font-family:var(--cond);font-weight:700;font-size:19px;
       letter-spacing:.4px;color:var(--ink2)}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      margin:0 12px 8px;display:flex;overflow:hidden}
.pick-qty{flex:none;width:66px;background:var(--signal);display:grid;place-items:center;
          font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;color:var(--ink)}
.pick-body{flex:1;min-width:0;padding:11px 12px}
.pick-name{font-weight:600;font-size:18px;line-height:1.25}
.pick-meta{font-size:13.5px;color:var(--ink2);margin-top:3px}
.pick-ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.mini{width:34px;height:34px;border-radius:8px;background:#EDEFEA;font-size:19px;
      display:grid;place-items:center;font-weight:600}
.done{flex:1;height:38px;border-radius:9px;background:var(--go);color:#fff;
      font-weight:600;font-size:15.5px}
.done:active{background:#155F3C}
.warn-line{background:#F7E6E3;color:var(--alert);font-size:13px;font-weight:500;
           padding:6px 12px;margin:0 12px 8px;border-radius:8px;margin-top:-4px}

/* ---------- history / settings ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      margin:12px;padding:14px}
.card h2{font-family:var(--cond);font-weight:700;font-size:20px;margin:0 0 4px}
.card p{font-size:14px;color:var(--ink2);margin:0 0 12px}
.btn-line{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:9px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid #E3C6C2;color:var(--alert)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border-bottom:none}
.hist .n{font-family:var(--cond);font-weight:700;font-size:18px}
.hist .t{color:var(--ink2);font-size:13px;white-space:nowrap}

/* ---------- empty ---------- */
.empty{text-align:center;padding:56px 30px;color:var(--ink2)}
.empty .big{font-family:var(--cond);font-weight:700;font-size:23px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:15px;margin:0 0 16px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);
     display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:11px 4px 13px;color:#8F9A93;font-size:12.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:#fff}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--signal)}
.badge{position:absolute;top:5px;right:calc(50% - 26px);background:var(--signal);color:var(--ink);
  font-family:var(--cond);font-weight:700;font-size:13px;min-width:20px;height:20px;border-radius:10px;
  display:grid;place-items:center;padding:0 5px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);
  border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .22s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.open{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:640px;margin:0 auto;padding:6px 16px 0}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 12px}
.sheet h2{font-family:var(--cond);font-weight:700;font-size:24px;margin:0 0 14px}
label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.field{margin-bottom:13px}
.field input{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:12px 13px;font-size:16px}
.field input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.two{display:flex;gap:10px}
.two .field{flex:1}
.sheet-actions{display:flex;gap:8px;margin:18px 0 6px}
.sheet-actions .btn{flex:1;text-align:center;padding:14px}

/* ---------- toast ---------- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;
  max-width:616px;margin:0 auto;background:var(--ink);color:#fff;border-radius:11px;
  padding:13px 14px;display:none;align-items:center;gap:12px;font-size:15px;
  box-shadow:0 6px 20px rgba(10,20,15,.28)}
.toast.show{display:flex}
.toast span{flex:1}
.toast button{color:var(--signal);font-weight:700;font-size:15px;flex:none}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <!-- ============ DEPO ============ -->
  <section id="view-depo">
    <div class="top">
      <div class="top-row">
        <div>
          <h1>Depo</h1>
          <div class="sub" id="depoSub">—</div>
        </div>
        <div class="top-actions">
          <button class="chip-btn solid" id="btnNew">+ Ürün</button>
        </div>
      </div>
      <div class="search" id="searchWrap">
        <input id="q" type="search" placeholder="Ürün ara" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="qClear" aria-label="Aramayı temizle">✕</button>
      </div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="rows" id="rows"></div>
  </section>

  <!-- ============ İNDİRİLECEK ============ -->
  <section id="view-liste" class="hidden">
    <div class="top">
      <div class="top-row">
        <div>
          <h1>İndirilecek</h1>
          <div class="sub" id="listeSub">—</div>
        </div>
        <div class="top-actions">
          <button class="chip-btn" id="btnClearList">Listeyi boşalt</button>
        </div>
      </div>
    </div>
    <div class="stripe"></div>
    <div id="pickWrap"></div>
  </section>

  <!-- ============ KAYIT ============ -->
  <section id="view-kayit" class="hidden">
    <div class="top">
      <div class="top-row">
        <div>
          <h1>Kayıt</h1>
          <div class="sub">İndirilenler ve yedekleme</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Son indirilenler</h2>
      <p>Yanlış tik attıysan buradan stoğu geri ekleyebilirsin.</p>
      <div id="histList"></div>
    </div>

    <div class="card">
      <h2>Yedekleme</h2>
      <p>Bütün depo listeni tek dosyaya indir. Telefon değişirse geri yükle.</p>
      <div class="btn-line">
        <button class="btn" id="btnExport">Yedek indir</button>
        <button class="btn ghost" id="btnImport">Yedekten yükle</button>
        <input type="file" id="fileIn" accept="application/json,.json" class="hidden">
      </div>
    </div>

    <div class="card">
      <h2>Sıfırla</h2>
      <p>Bütün ürünler ve kayıtlar silinir. Geri alınamaz.</p>
      <div class="btn-line">
        <button class="btn danger" id="btnReset">Her şeyi sil</button>
      </div>
    </div>
  </section>

  <nav class="nav">
    <button data-tab="depo" class="on"><span class="ic">▦</span>Depo</button>
    <button data-tab="liste"><span class="ic">▼</span>İndirilecek<span class="badge hidden" id="navBadge">0</span></button>
    <button data-tab="kayit"><span class="ic">✓</span>Kayıt</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <h2 id="sheetTitle">Yeni ürün</h2>
    <div class="field">
      <label for="fAd">Ürün adı</label>
      <input id="fAd" type="text" placeholder="Örn. Çaykur Rize Turist 1 kg" autocomplete="off">
    </div>
    <div class="two">
      <div class="field">
        <label for="fKat">Kategori</label>
        <input id="fKat" type="text" list="katList" placeholder="Gıda" autocomplete="off">
        <datalist id="katList"></datalist>
      </div>
      <div class="field">
        <label for="fKonum">Depo yeri</label>
        <input id="fKonum" type="text" placeholder="A3" autocomplete="off">
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label for="fStok">Depodaki adet</label>
        <input id="fStok" type="number" inputmode="numeric" min="0" value="0">
      </div>
      <div class="field">
        <label for="fMin">Şu adede düşünce uyar</label>
        <input id="fMin" type="number" inputmode="numeric" min="0" value="3">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="btnCancel">Vazgeç</button>
      <button class="btn" id="btnSave">Kaydet</button>
    </div>
    <div class="btn-line hidden" id="delWrap" style="margin-bottom:8px">
      <button class="btn danger" id="btnDelete" style="width:100%">Ürünü sil</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastAct" class="hidden"></button></div>

<script>
(function(){
"use strict";

var KEY = "depo_takip_v1";
var db = { products: [], list: [], history: [], nextId: 1 };
var tab = "depo";
var filterCat = "";
var query = "";
var editingId = null;
var lastUndo = null;
var toastTimer = null;

/* ---------- örnek başlangıç verisi ---------- */
function seed(){
  var s = [
    ["Çay 1 kg","Gıda","A1",24,4],["Şeker 1 kg","Gıda","A1",30,5],
    ["Ayçiçek yağı 1 L","Gıda","A2",18,4],["Un 2 kg","Gıda","A2",16,3],
    ["Makarna 500 g","Gıda","A3",40,6],["Pirinç 1 kg","Gıda","A3",22,4],
    ["Salça 700 g","Gıda","A4",14,3],["Tuz 750 g","Gıda","A4",20,4],
    ["Su 5 L","İçecek","B1",36,6],["Kola 2,5 L","İçecek","B1",24,6],
    ["Meyve suyu 1 L","İçecek","B2",18,4],["Ayran 1 L","İçecek","B2",20,5],
    ["Bulaşık deterjanı 1 L","Temizlik","C1",15,3],["Çamaşır suyu 1 L","Temizlik","C1",12,3],
    ["Yüzey temizleyici","Temizlik","C2",10,2],["Bulaşık süngeri","Temizlik","C2",25,5],
    ["Tuvalet kağıdı 8'li","Kağıt","D1",14,3],["Peçete 100'lü","Kağıt","D1",18,4],
    ["Şampuan 500 ml","Kişisel bakım","D2",9,2],["Diş macunu","Kişisel bakım","D2",12,3],
    ["Cips 150 g","Atıştırmalık","E1",28,6],["Bisküvi paketi","Atıştırmalık","E1",34,6],
    ["Çikolata","Atıştırmalık","E2",30,6],["Sakız","Atıştırmalık","E2",26,5]
  ];
  db.products = s.map(function(p){
    return { id: db.nextId++, ad:p[0], kat:p[1], konum:p[2], stok:p[3], min:p[4] };
  });
}

/* ---------- kalıcı kayıt ---------- */
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var s = JSON.stringify(db);
    try { localStorage.setItem(KEY, s); } catch(e){}
    try { if (window.storage && window.storage.set) window.storage.set(KEY, s); } catch(e){}
  }, 120);
}
function load(cb){
  var local = null;
  try { local = localStorage.getItem(KEY); } catch(e){}
  if (window.storage && window.storage.get){
    window.storage.get(KEY).then(function(r){
      finish(r && r.value ? r.value : local);
    }).catch(function(){ finish(local); });
  } else finish(local);

  function finish(raw){
    if (raw){
      try{
        var d = JSON.parse(raw);
        if (d && d.products) db = {
          products: d.products || [], list: d.list || [],
          history: d.history || [], nextId: d.nextId || (d.products.length+1)
        };
      }catch(e){ seed(); }
    } else { seed(); save(); }
    cb();
  }
}

/* ---------- yardımcılar ---------- */
function norm(s){
  return (s||"").toLocaleLowerCase("tr")
    .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
    .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/â/g,"a").trim();
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function byId(id){ for (var i=0;i<db.products.length;i++) if (db.products[i].id===id) return db.products[i]; return null; }
function inList(id){ for (var i=0;i<db.list.length;i++) if (db.list[i].id===id) return db.list[i]; return null; }
function totalList(){ var t=0; db.list.forEach(function(x){ t+=x.adet; }); return t; }
function buzz(ms){ try{ if (navigator.vibrate) navigator.vibrate(ms||15); }catch(e){} }
function saat(ts){
  var d = new Date(ts), n = new Date();
  var p = function(x){ return x<10?"0"+x:""+x; };
  var t = p(d.getHours())+":"+p(d.getMinutes());
  if (d.toDateString()===n.toDateString()) return t;
  return p(d.getDate())+"."+p(d.getMonth()+1)+" "+t;
}
function toast(msg, actionLabel, action){
  var t = document.getElementById("toast");
  document.getElementById("toastText").textContent = msg;
  var b = document.getElementById("toastAct");
  if (actionLabel){
    b.textContent = actionLabel; b.classList.remove("hidden");
    b.onclick = function(){ hideToast(); action(); };
  } else b.classList.add("hidden");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2400);
}
function hideToast(){ document.getElementById("toast").classList.remove("show"); }

/* ---------- sekmeler ---------- */
function setTab(name){
  tab = name;
  ["depo","liste","kayit"].forEach(function(n){
    document.getElementById("view-"+n).classList.toggle("hidden", n!==name);
  });
  var btns = document.querySelectorAll(".nav button");
  for (var i=0;i<btns.length;i++) btns[i].classList.toggle("on", btns[i].dataset.tab===name);
  window.scrollTo(0,0);
  render();
}

/* ---------- kategoriler ---------- */
function renderCats(){
  var seen = [], el = document.getElementById("cats");
  db.products.forEach(function(p){
    var k = (p.kat||"Diğer").trim() || "Diğer";
    if (seen.indexOf(k)===-1) seen.push(k);
  });
  seen.sort(function(a,b){ return a.localeCompare(b,"tr"); });
  var html = '<button class="cat'+(filterCat===""?" on":"")+'" data-cat="">Tümü</button>';
  seen.forEach(function(k){
    html += '<button class="cat'+(filterCat===k?" on":"")+'" data-cat="'+esc(k)+'">'+esc(k)+'</button>';
  });
  el.innerHTML = html;
  var dl = document.getElementById("katList");
  dl.innerHTML = seen.map(function(k){ return '<option value="'+esc(k)+'">'; }).join("");
}

/* ---------- depo listesi ---------- */
function renderDepo(){
  renderCats();
  var q = norm(query);
  var list = db.products.filter(function(p){
    if (filterCat && (p.kat||"Diğer")!==filterCat) return false;
    if (!q) return true;
    return norm(p.ad).indexOf(q)>-1 || norm(p.konum).indexOf(q)>-1 || norm(p.kat).indexOf(q)>-1;
  });
  list.sort(function(a,b){
    var la=(a.konum||"zzz"), lb=(b.konum||"zzz");
    if (la!==lb) return la.localeCompare(lb,"tr");
    return a.ad.localeCompare(b.ad,"tr");
  });

  var az = db.products.filter(function(p){ return p.stok<=p.min; }).length;
  document.getElementById("depoSub").textContent =
    db.products.length + " ürün" + (az ? " · " + az + " tanesi azaldı" : "");

  var wrap = document.getElementById("rows");
  if (!db.products.length){
    wrap.innerHTML = '<div class="empty"><div class="big">Depo boş</div>'+
      '<p>Yukarıdaki + Ürün ile depodaki ürünleri tek tek ekle. Bir kere ekle, sonra sadece adetle uğraş.</p></div>';
    return;
  }
  if (!list.length){
    wrap.innerHTML = '<div class="empty"><div class="big">Bulunamadı</div>'+
      '<p>Aramayı değiştir ya da bu ürünü yeni kayıt olarak ekle.</p>'+
      '<button class="btn" id="addFromSearch">"'+esc(query)+'" ürününü ekle</button></div>';
    var b = document.getElementById("addFromSearch");
    if (b) b.onclick = function(){ openSheet(null, query); };
    return;
  }

  wrap.innerHTML = list.map(function(p){
    var q0 = inList(p.id);
    var pend = q0 ? q0.adet : 0;
    var cls = "row" + (pend ? " queued" : "") + (p.stok<=0 ? " empty-stock" : "");
    var tags = "";
    if (p.konum) tags += '<span class="tag loc">'+esc(p.konum)+'</span>';
    if (p.stok<=0) tags += '<span class="tag zero">depoda yok</span>';
    else if (p.stok<=p.min) tags += '<span class="tag low">az kaldı</span>';

    var ctl;
    if (pend){
      ctl = '<div class="stepper">'+
        '<button data-act="dec" data-id="'+p.id+'" aria-label="Azalt">−</button>'+
        '<span class="qty">'+pend+'</span>'+
        '<button data-act="inc" data-id="'+p.id+'" aria-label="Artır">+</button></div>';
    } else {
      ctl = '<button class="add-btn" data-act="inc" data-id="'+p.id+'" '+
            (p.stok<=0?"disabled":"")+' aria-label="Listeye ekle">+</button>';
    }

    return '<div class="'+cls+'">'+
      '<div class="r-main">'+
        '<div class="r-name">'+esc(p.ad)+'</div>'+
        '<div class="r-meta">'+tags+'<span>Depoda <b>'+p.stok+'</b></span></div>'+
      '</div>'+
      ctl+
      '<button class="r-edit" data-act="edit" data-id="'+p.id+'" aria-label="Düzenle">✎</button>'+
    '</div>';
  }).join("");
}

/* ---------- indirilecek listesi ---------- */
function renderListe(){
  var wrap = document.getElementById("pickWrap");
  document.getElementById("listeSub").textContent =
    db.list.length ? db.list.length + " çeşit · " + totalList() + " adet" : "Liste boş";

  if (!db.list.length){
    wrap.innerHTML = '<div class="empty"><div class="big">Liste boş</div>'+
      '<p>Depo sekmesinden rafa lazım olan ürünlere + bas. Yukarı çıkınca burayı aç, ne kadar indireceğin yazıyor.</p>'+
      '<button class="btn" id="goDepo">Depoya git</button></div>';
    var g = document.getElementById("goDepo");
    if (g) g.onclick = function(){ setTab("depo"); };
    return;
  }

  var items = db.list.map(function(it){
    var p = byId(it.id);
    return { it:it, p:p, konum: (p && p.konum) ? p.konum : "" };
  }).filter(function(x){ return x.p; });

  items.sort(function(a,b){
    var la=a.konum||"zzz", lb=b.konum||"zzz";
    if (la!==lb) return la.localeCompare(lb,"tr");
    return a.p.ad.localeCompare(b.p.ad,"tr");
  });

  var html = "", currentGroup = null;
  items.forEach(function(x){
    var g = x.konum || "Yeri girilmemiş";
    if (g!==currentGroup){
      currentGroup = g;
      html += '<div class="group">'+esc(g)+'</div>';
    }
    var yetmez = x.it.adet > x.p.stok;
    html += '<div class="pick">'+
      '<div class="pick-qty">'+x.it.adet+'</div>'+
      '<div class="pick-body">'+
        '<div class="pick-name">'+esc(x.p.ad)+'</div>'+
        '<div class="pick-meta">Depoda '+x.p.stok+' adet var</div>'+
        '<div class="pick-ctl">'+
          '<button class="mini" data-act="dec" data-id="'+x.p.id+'" aria-label="Azalt">−</button>'+
          '<button class="mini" data-act="inc" data-id="'+x.p.id+'" aria-label="Artır">+</button>'+
          '<button class="done" data-act="done" data-id="'+x.p.id+'">İndirdim</button>'+
        '</div>'+
      '</div></div>';
    if (yetmez) html += '<div class="warn-line">Depoda bu kadar yok. Bulduğun kadarını indir, adedi düzelt.</div>';
  });
  wrap.innerHTML = html;
}

/* ---------- kayıt ---------- */
function renderKayit(){
  var el = document.getElementById("histList");
  if (!db.history.length){
    el.innerHTML = '<div style="color:var(--ink2);font-size:15px">Henüz indirilen ürün yok.</div>';
    return;
  }
  el.innerHTML = db.history.slice(0,40).map(function(h,i){
    return '<div class="hist">'+
      '<span><span class="n">'+h.adet+'</span> &nbsp;'+esc(h.ad)+'</span>'+
      '<span class="t">'+saat(h.ts)+' <button data-act="unhist" data-i="'+i+'" style="color:var(--ink2);text-decoration:underline;font-size:13px">geri al</button></span>'+
    '</div>';
  }).join("");
}

function renderBadge(){
  var b = document.getElementById("navBadge"), n = db.list.length;
  b.textContent = n;
  b.classList.toggle("hidden", n===0);
}

function render(){
  if (tab==="depo") renderDepo();
  else if (tab==="liste") renderListe();
  else renderKayit();
  renderBadge();
}

/* ---------- işlemler ---------- */
function inc(id){
  var p = byId(id); if (!p) return;
  var it = inList(id);
  if (it) it.adet++;
  else db.list.push({ id:id, adet:1 });
  buzz(12); save(); render();
}
function dec(id){
  var it = inList(id); if (!it) return;
  it.adet--;
  if (it.adet<=0) db.list = db.list.filter(function(x){ return x.id!==id; });
  buzz(12); save(); render();
}
function done(id){
  var it = inList(id), p = byId(id);
  if (!it || !p) return;
  var adet = it.adet, oncekiStok = p.stok;
  p.stok = Math.max(0, p.stok - adet);
  db.list = db.list.filter(function(x){ return x.id!==id; });
  db.history.unshift({ id:id, ad:p.ad, adet:adet, ts:Date.now(), oncekiStok:oncekiStok });
  if (db.history.length>200) db.history.length = 200;
  buzz([18,40,18]); save(); render();
  toast(adet+" "+p.ad+" indirildi", "Geri al", function(){
    p.stok = oncekiStok;
    db.list.push({ id:id, adet:adet });
    db.history = db.history.filter(function(h){ return !(h.id===id && h.adet===adet && h.oncekiStok===oncekiStok); });
    save(); render();
  });
}
function unhist(i){
  var h = db.history[i]; if (!h) return;
  var p = byId(h.id);
  if (p) p.stok = p.stok + h.adet;
  db.history.splice(i,1);
  save(); render();
  toast(h.adet+" adet depo stoğuna geri eklendi");
}

/* ---------- ürün formu ---------- */
function openSheet(id, prefillName){
  editingId = id;
  var p = id ? byId(id) : null;
  document.getElementById("sheetTitle").textContent = p ? "Ürünü düzenle" : "Yeni ürün";
  document.getElementById("fAd").value = p ? p.ad : (prefillName||"");
  document.getElementById("fKat").value = p ? (p.kat||"") : "";
  document.getElementById("fKonum").value = p ? (p.konum||"") : "";
  document.getElementById("fStok").value = p ? p.stok : 0;
  document.getElementById("fMin").value = p ? p.min : 3;
  document.getElementById("delWrap").classList.toggle("hidden", !p);
  document.getElementById("scrim").classList.add("open");
  document.getElementById("sheet").classList.add("open");
  setTimeout(function(){ document.getElementById("fAd").focus(); }, 220);
}
function closeSheet(){
  document.getElementById("scrim").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
  editingId = null;
}
function saveSheet(){
  var ad = document.getElementById("fAd").value.trim();
  if (!ad){ document.getElementById("fAd").focus(); toast("Ürün adı gerekli"); return; }
  var kat = document.getElementById("fKat").value.trim() || "Diğer";
  var konum = document.getElementById("fKonum").value.trim();
  var stok = Math.max(0, parseInt(document.getElementById("fStok").value,10) || 0);
  var min = Math.max(0, parseInt(document.getElementById("fMin").value,10) || 0);

  if (editingId){
    var p = byId(editingId);
    if (p){ p.ad=ad; p.kat=kat; p.konum=konum; p.stok=stok; p.min=min; }
    toast("Kaydedildi");
  } else {
    db.products.push({ id: db.nextId++, ad:ad, kat:kat, konum:konum, stok:stok, min:min });
    toast(ad+" eklendi");
  }
  closeSheet(); save(); render();
}
function deleteProduct(){
  var p = byId(editingId); if (!p) return;
  if (!confirm(p.ad+" silinsin mi?")) return;
  db.products = db.products.filter(function(x){ return x.id!==editingId; });
  db.list = db.list.filter(function(x){ return x.id!==editingId; });
  closeSheet(); save(); render();
  toast("Ürün silindi");
}

/* ---------- yedekleme ---------- */
function exportData(){
  var blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
  var d = new Date(), p = function(x){ return x<10?"0"+x:""+x; };
  var name = "depo-yedek-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Yedek indirildi");
}
function importData(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if (!d || !d.products) throw 0;
      db = { products:d.products, list:d.list||[], history:d.history||[],
             nextId:d.nextId || (d.products.length+1) };
      save(); render();
      toast(db.products.length+" ürün geri yüklendi");
    }catch(e){ toast("Dosya okunamadı. Uygulamadan indirdiğin yedek dosyasını seç."); }
  };
  r.readAsText(file);
}

/* ---------- olaylar ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if (t){
    var act = t.dataset.act, id = parseInt(t.dataset.id,10);
    if (act==="inc") return inc(id);
    if (act==="dec") return dec(id);
    if (act==="done") return done(id);
    if (act==="edit") return openSheet(id);
    if (act==="unhist") return unhist(parseInt(t.dataset.i,10));
  }
  var c = e.target.closest(".cat");
  if (c){ filterCat = c.dataset.cat; renderDepo(); return; }
  var n = e.target.closest(".nav button");
  if (n){ setTab(n.dataset.tab); return; }
});

document.getElementById("q").addEventListener("input", function(e){
  query = e.target.value;
  document.getElementById("searchWrap").classList.toggle("has", !!query);
  renderDepo();
});
document.getElementById("qClear").onclick = function(){
  query = ""; document.getElementById("q").value = "";
  document.getElementById("searchWrap").classList.remove("has");
  renderDepo();
};
document.getElementById("btnNew").onclick = function(){ openSheet(null); };
document.getElementById("btnCancel").onclick = closeSheet;
document.getElementById("scrim").onclick = closeSheet;
document.getElementById("btnSave").onclick = saveSheet;
document.getElementById("btnDelete").onclick = deleteProduct;
document.getElementById("btnClearList").onclick = function(){
  if (!db.list.length) return toast("Liste zaten boş");
  var yedek = db.list.slice();
  db.list = []; save(); render();
  toast("Liste boşaltıldı", "Geri al", function(){ db.list = yedek; save(); render(); });
};
document.getElementById("btnExport").onclick = exportData;
document.getElementById("btnImport").onclick = function(){ document.getElementById("fileIn").click(); };
document.getElementById("fileIn").onchange = function(e){
  if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
  e.target.value = "";
};
document.getElementById("btnReset").onclick = function(){
  if (!confirm("Bütün ürünler, liste ve kayıtlar silinecek. Emin misin?")) return;
  db = { products:[], list:[], history:[], nextId:1 };
  save(); render();
  toast("Her şey silindi");
};
document.addEventListener("keydown", function(e){
  if (e.key==="Escape") closeSheet();
  if (e.key==="Enter" && document.getElementById("sheet").classList.contains("open")
      && e.target.tagName==="INPUT") saveSheet();
});

load(function(){ render(); });
})();
</script>
</body>
</html>
